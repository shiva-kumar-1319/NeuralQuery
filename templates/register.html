<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - NeuralQuery AI Research Assistant</title>
    <meta name="description"
        content="Create a NeuralQuery account to start using the most advanced AI-powered research assistant for free.">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #FFFFFF;
        }

        .auth-container {
            width: 100%;
            max-width: 450px;
            padding: var(--space-lg);
        }

        .auth-card {
            background: #FFFFFF;
            padding: var(--space-2xl);
            /* Remove heavy shadow for cleaner look */
            /* box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3); */
            border: 1px solid var(--border-color);
        }

        .auth-header {
            text-align: center;
            margin-bottom: var(--space-xl);
        }

        .auth-header h1 {
            font-size: var(--text-3xl);
            color: var(--text-primary);
            margin-bottom: var(--space-sm);
        }

        .auth-header p {
            color: var(--text-secondary);
            margin-bottom: 0;
        }

        .auth-footer {
            text-align: center;
            margin-top: var(--space-lg);
            padding-top: var(--space-lg);
            border-top: 1px solid var(--border-light);
        }

        .auth-footer p {
            color: var(--text-secondary);
            margin-bottom: 0;
        }

        .logo {
            font-size: 3rem;
            margin-bottom: var(--space-sm);
        }

        .btn-full {
            width: 100%;
        }

        #loading {
            display: none;
        }

        .password-strength {
            margin-top: var(--space-xs);
            height: 4px;
            background: var(--border-light);
            border-radius: var(--radius-full);
            overflow: hidden;
        }

        .password-strength-bar {
            height: 100%;
            width: 0%;
            transition: all 0.3s ease;
        }

        .strength-weak {
            background: var(--error);
            width: 33%;
        }

        .strength-medium {
            background: var(--warning);
            width: 66%;
        }

        .strength-strong {
            background: var(--success);
            width: 100%;
        }
    </style>
</head>

<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo"><img src="/static/img/logo.png" alt="NeuralQuery" style="height: 80px;"></div>
                <h1>Create Account</h1>
                <p>Start your AI-powered research journey</p>
            </div>

            <div id="alert-container"></div>

            <form id="registerForm">
                <div class="form-group">
                    <label for="fullName" class="form-label">Full Name</label>
                    <input type="text" id="fullName" class="form-input" placeholder="John Doe" required
                        autocomplete="name">
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" id="email" class="form-input" placeholder="you@example.com" required
                        autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required
                        autocomplete="new-password" minlength="6">
                    <div class="password-strength">
                        <div id="strength-bar" class="password-strength-bar"></div>
                    </div>
                    <small id="password-hint"
                        style="color: var(--text-secondary); font-size: var(--text-xs); margin-top: var(--space-xs); display: block;">
                        Minimum 6 characters
                    </small>
                </div>

                <div class="form-group">
                    <label for="confirmPassword" class="form-label">Confirm Password</label>
                    <input type="password" id="confirmPassword" class="form-input" placeholder="••••••••" required
                        autocomplete="new-password">
                </div>

                <button type="submit" class="btn btn-primary btn-full btn-lg">
                    <span id="btn-text">Create Account</span>
                    <span id="loading" class="spinner"></span>
                </button>
            </form>

            <div class="auth-footer">
                <p>Already have an account? <a href="/login">Login</a></p>
                <p style="margin-top: var(--space-sm);"><a href="/">← Back to Home</a></p>
            </div>
        </div>
    </div>

    <script>
        // Password strength indicator
        document.getElementById('password').addEventListener('input', (e) => {
            const password = e.target.value;
            const strengthBar = document.getElementById('strength-bar');
            const hint = document.getElementById('password-hint');

            strengthBar.className = 'password-strength-bar';

            if (password.length === 0) {
                hint.textContent = 'Minimum 6 characters';
                hint.style.color = 'var(--text-secondary)';
            } else if (password.length < 6) {
                strengthBar.classList.add('strength-weak');
                hint.textContent = 'Too short';
                hint.style.color = 'var(--error)';
            } else if (password.length < 10) {
                strengthBar.classList.add('strength-medium');
                hint.textContent = 'Medium strength';
                hint.style.color = 'var(--warning)';
            } else {
                strengthBar.classList.add('strength-strong');
                hint.textContent = 'Strong password';
                hint.style.color = 'var(--success)';
            }
        });

        // Register Form Handler
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const fullName = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const btnText = document.getElementById('btn-text');
            const loading = document.getElementById('loading');
            const submitBtn = e.target.querySelector('button[type="submit"]');

            // Clear previous alerts
            document.getElementById('alert-container').innerHTML = '';

            // Validate passwords match
            if (password !== confirmPassword) {
                showAlert('Passwords do not match', 'error');
                return;
            }

            // Validate password length
            if (password.length < 6) {
                showAlert('Password must be at least 6 characters', 'error');
                return;
            }

            // Show loading state
            btnText.style.display = 'none';
            loading.style.display = 'inline-block';
            submitBtn.disabled = true;

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        full_name: fullName,
                        email: email,
                        password: password
                    })
                });

                const data = await response.json();

                if (data.success) {
                    // Save token to localStorage
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));

                    // Show success message
                    showAlert('Account created!', 'success');

                    // Redirect to chat
                    window.location.replace('/chat');
                } else {
                    showAlert(data.error || 'Registration failed', 'error');
                    resetButton();
                }
            } catch (error) {
                console.error('Registration error:', error);
                showAlert('An error occurred. Please try again.', 'error');
                resetButton();
            }

            function resetButton() {
                btnText.style.display = 'inline';
                loading.style.display = 'none';
                submitBtn.disabled = false;
            }
        });

        function showAlert(message, type) {
            const alertContainer = document.getElementById('alert-container');
            const alertClass = type === 'success' ? 'alert-success' : 'alert-error';
            alertContainer.innerHTML = `
                <div class="alert ${alertClass}">
                    ${message}
                </div>
            `;
        }

        // Auto-focus full name field
        document.getElementById('fullName').focus();
    </script>
</body>

</html>
